<!DOCTYPE html>
<html lang="en">
{% load static %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <!-- Google Fonts + Font Awesome -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <style>
        /* Reset */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #ffffff, #0b33b4);
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        

        .header {
            width: 100%;
            background: linear-gradient(180deg, rgba(25, 118, 210, 1) 0%, rgba(21, 63, 112, 0.515) 100%);
            color: white;
            padding: 20px 0;
            font-size: 36px;
            font-weight: 600;
            text-align: center;
            z-index: 10;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        .login-container {
            display: flex;
            flex-wrap: wrap;
            background: #fff;
            border-radius: 12px;
            max-width: 900px;
            width: 95%;
            margin-top: 40px;
            overflow: hidden;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
            animation: fadeIn 0.6s ease-in-out;
        }

        .form-section, .welcome-section {
            flex: 1 1 300px;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .form-section {
            background-color: #fff;
        }

        .welcome-section {
            background: linear-gradient(180deg, rgba(25, 118, 210, 1) 0%, rgb(21, 64, 112) 100%);
            color: white;
            text-align: center;
        }

        .logo-container {
            text-align: center;
            margin-bottom: 20px;
        }

        .logo-container img {
            height: 100px;
        }

        h2, h1 {
            font-size: 28px;
            margin-bottom: 15px;
        }

        p {
            font-size: 16px;
            margin-bottom: 20px;
        }

        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #1976d2;
        }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(180deg, rgba(25, 118, 210, 1), rgb(21, 64, 112));
            border: none;
            color: white;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #174a87;
        }

        .options {
            display: flex;
            justify-content: flex-start;
            align-items: center;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .options input {
            margin-right: 5px;
        }

        .messages {
            margin-bottom: 15px;
        }

        .messages .error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            padding: 10px;
            border-radius: 5px;
        }

        .messages .success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            padding: 10px;
            border-radius: 5px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            .login-container {
                flex-direction: column;
            }

            .form-section, .welcome-section {
                width: 100%;
                border-radius: 0;
                padding: 30px 20px;
            }

            .header {
                font-size: 28px;
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        WSSP DASHBOARD
    </div>

    <div class="login-container">
        <div class="form-section">
            <div class="logo-container">
                <img src="{% static 'logo/download__7___1_-removebg-preview.png' %}" alt="Logo">
            </div>

            {% if messages %}
                <div class="messages">
                    <ul>
                        {% for message in messages %}
                            <li class="{{ message.tags }}">{{ message }}</li>
                        {% endfor %}
                    </ul>
                </div>
            {% endif %}

            <form method="post">
                {% csrf_token %}
                <input type="text" name="username" placeholder="Username" required>
                <input type="password" name="password" placeholder="Password" required>

                <div class="options">
                    <label><input type="checkbox" name="remember"> Remember Me</label>
                </div>

                <button type="submit">login</button>
            </form>
        </div>

        <div class="welcome-section">
            <h1>Welcome</h1>
            <p>Please enter your credentials to access your account.</p>
        </div>
    </div>
</body>
</html>
