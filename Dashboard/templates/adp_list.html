{% extends 'base.html' %}

{% block content %}
<h1 class="h3 mb-4 text-gray-800" style="font-weight: bold; font-size: 1.5rem; text-align: center;">
    ADP Data File
</h1>


<table class="table table-bordered table-hover shadow-sm bg-white">
    <thead class="bg-primary text-white">
        <tr>
            <th>Sr.No</th>
            <th>File Name</th>
            <th>Download File</th>
        </tr>
    </thead>
    <tbody>
        {% for document in documents %}
        <tr>
            <td>{{ forloop.counter }}</td>
            <td>{{ document.file_name }}</td>
            <td>
                <a href="{{ document.uploaded_file.url }}" download class="btn btn-success btn-sm">
                    Download
                </a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
