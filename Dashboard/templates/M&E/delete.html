{% extends "base.html" %}
{% load static %}

{% block content %}

<div class="container mt-5">

    <div class="card shadow-sm p-4 text-center">

        <h2 class="text-danger mb-3">
            ⚠️ Delete Evaluation
        </h2>

        <p class="lead">
            Are you sure you want to delete this evaluation?
        </p>

        <form method="post">
            {% csrf_token %}

            <div class="mt-4">
                <button type="submit" class="btn btn-danger me-2">
                    🗑 Yes, Delete
                </button>

                <a href="{% url 'visit_evaluation_list' %}" class="btn btn-secondary">
                    ❌ Cancel
                </a>
            </div>

        </form>

    </div>

</div>

{% endblock %}
