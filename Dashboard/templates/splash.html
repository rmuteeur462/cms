<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Splash Screen</title>
    <meta http-equiv="refresh" content="3;url={% url 'home' %}">
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ffffff, #0b33b4);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            animation: fadeIn 2s ease-in-out forwards;
        }

        .splash {
            text-align: center;
            color: white;
            opacity: 0;
            transform: scale(0.8);
            animation: popIn 1.5s ease-in-out forwards 1s;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            animation: slideDown 1s ease-out forwards;
        }

        p {
            font-size: 1.2rem;
            opacity: 0;
            animation: fadeText 2s ease-in-out forwards 2s;
        }

        .logo {
            width: 400px;
            margin-bottom: -40px;
            opacity: 0;
            animation: fadeLogo 1.5s ease-in-out forwards;
        }

        /* Animations */
        @keyframes fadeIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }

        @keyframes slideDown {
            0% { transform: translateY(-30px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        @keyframes fadeText {
            0% { opacity: 0; transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeLogo {
            0% { opacity: 0; transform: translateY(-20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="splash">
        {% load static %}

        <img src="{% static 'logo/download__7___1_-removebg-preview.png' %}" alt="Logo" class="logo">
        <!-- <h2>Welcome to the WSSP DASHBOARD</h2> -->
        <!-- <p>Loading your experience... please wait</p> -->
    </div>
</body>
</html>
