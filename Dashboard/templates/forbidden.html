<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Permission Denied</title>
    <!-- Include Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Modern and elegant modal styling */
        .modal-content {
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        .modal-header {
            background-color: #f8f9fa;
            border-bottom: none;
            padding: 20px;
        }
        .modal-title {
            font-size: 1.5rem;
            font-weight: bold;
            color: #343a40;
        }
        .modal-body {
            padding: 30px;
            font-size: 1.1rem;
            color: #6c757d;
        }
        .close-btn {
            background-color: #343a40;
            color: #fff;
            border-radius: 20px;
            padding: 5px 20px;
            border: none;
        }
    </style>
</head>
<body>
    <!-- Modal HTML structure -->
    <div class="modal fade" id="forbiddenModal" tabindex="-1" aria-labelledby="forbiddenModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="forbiddenModalLabel">Access Denied</h5>
                </div>
                <div class="modal-body text-center">
                    {{ message }}
                </div>
                <div class="modal-footer justify-content-center border-top-0">
                    <button type="button" class="close-btn" id="closeButton" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS (necessary for modal) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Script to automatically trigger the modal when the page loads -->
    <script type="text/javascript">
        document.addEventListener("DOMContentLoaded", function() {
            var myModal = new bootstrap.Modal(document.getElementById('forbiddenModal'));
            myModal.show();

            // Redirect to the home page when "Close" is clicked
            document.getElementById("closeButton").addEventListener("click", function() {
                window.location.href = "{% url 'home' %}";
            });
        });
    </script>
</body>
</html>
