{% extends 'base.html' %}

{% block content %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Location Map</title>
    <script src="https://cdn.jsdelivr.net/npm/ol@v10.2.1/dist/ol.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@v10.2.1/ol.css">
    <style>
        #map {
            width: 100%;
            height: 500px;
        }
    </style>
</head>
<body>

    <h1 class="h3 mb-4 text-gray-800" style="font-weight: bold; font-size: 1.5rem; text-align: center;">
        All WSSP Office Locations
    </h1>

    <div id="map"></div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const map = new ol.Map({
                target: 'map',
                layers: [
                    new ol.layer.Tile({
                        source: new ol.source.OSM()
                    })
                ],
                view: new ol.View({
                    center: ol.proj.fromLonLat([0, 0]),
                    zoom: 2
                })
            });

            fetch("{% url 'location_map_geojson' %}")
                .then(response => response.json())
                .then(data => {
                    const features = new ol.format.GeoJSON().readFeatures(data, {
                        featureProjection: 'EPSG:3857'
                    });

                    // Apply styles to features
                    const styledFeatures = features.map(feature => {
                        const userName = feature.get('name'); // Assuming 'name' is the property for the user name
                        feature.setStyle(
                            new ol.style.Style({
                                image: new ol.style.Circle({
                                    radius: 6,
                                    fill: new ol.style.Fill({ color: 'red' }),
                                    stroke: new ol.style.Stroke({ color: 'white', width: 2 })
                                }),
                                text: new ol.style.Text({
                                    text: `**${userName}**`, // Bold name
                                    font: 'bold 12px Arial',
                                    fill: new ol.style.Fill({ color: '#000' }),
                                    stroke: new ol.style.Stroke({ color: '#fff', width: 3 }),
                                    offsetY: -15 // Position the text above the marker
                                })
                            })
                        );
                        return feature;
                    });

                    const vectorSource = new ol.source.Vector({
                        features: styledFeatures
                    });

                    const vectorLayer = new ol.layer.Vector({
                        source: vectorSource
                    });

                    map.addLayer(vectorLayer);

                    // Add click event to open Google Maps with the clicked location
                    map.on('click', function (event) {
                        const feature = map.forEachFeatureAtPixel(event.pixel, function (feature) {
                            return feature;
                        });

                        if (feature) {
                            const coordinates = feature.getGeometry().getCoordinates();
                            const lonLat = ol.proj.toLonLat(coordinates);
                            const lon = lonLat[0];
                            const lat = lonLat[1];
                            // Open Google Maps in a new tab
                            window.open(`https://www.google.com/maps?q=${lat},${lon}`, '_blank');
                        }
                    });
                })
                .catch(error => console.error('Error loading GeoJSON data:', error));
        });
    </script>
</body>
{% endblock %}
