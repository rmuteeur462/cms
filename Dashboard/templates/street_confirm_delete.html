{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
    <h4>Confirm Delete</h4>
    <p>Are you sure you want to delete <strong>{{ object.street_name }}</strong>?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, Delete</button>
        <a href="{% url 'street_list' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
