{% load static %}

<!-- Move internal CSS outside of the HTML structure -->
<style>
    #accordionSidebar {
        width: 230px !important; /* Ensure sidebar width is increased */
    }

    .collapse-header {
        font-weight: bold;
        color: #0b33b4; /* Change this to your desired color */
    }
    
    .collapse-item {
        color: #212529; /* Default link color */
    }

    .collapse-item:hover {
        background-color: #f1f1f1; /* Highlight on hover */
        color: #0b33b4; /* Change color on hover */
    }

    .logo {
        width: 140px; /* Define logo size in CSS */
        height: auto; 
    }

    .active {
        background-color: rgba(255, 255, 255, 0.1); /* Active link background color */
    }
  

@keyframes bounce {
    0%, 100% {
        transform: translateY(0);
    }
    50% {
        transform: translateY(-10px);
    }
}

.logo {
    width: 140px;
    height: auto;
    animation: bounce 3s infinite ease-in-out;
}

.info-icon2 {
    font-size: 18px;
    animation: blink-animation 1.5s infinite alternate, cubic-bezier(0.6, -0.28, 0.735, 0.045) infinite;
}

</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", function() {
        gsap.from(".logo", { opacity: 0, scale: 0.5, duration: 1.5, ease: "power3.out" });
        gsap.to(".logo", { y: -10, repeat: -1, yoyo: true, duration: 1.5, ease: "power1.inOut" });
    });
</script>

<ul class="navbar-nav bg-primary sidebar sidebar-dark accordion" id="accordionSidebar" style="background: linear-gradient(180deg, rgba(25, 118, 210, 1) 0%, rgb(21, 64, 112) 100%);">

<br>
<br>
    <!-- Sidebar - Brand -->
    <a class="sidebar-brand d-flex align-items-center justify-content-center" href="{% url 'home' %}">
        <div class="sidebar-brand-icon">
            <img src="{% static 'logo/file.png' %}" alt="Logo" class="logo info-icon2"> <!-- Adjust the size as needed -->
        </div>
    </a>

    <br>
    


    <!-- Nav Item - Dashboard -->
    <li class="nav-item">
        <a class="nav-link" href="{% url 'home' %}">
            <i class="fas fa-fw fa-tachometer-alt info-icon2"></i>
            <span><strong>Dashboard</strong></span>
        </a>
    </li>

   
   
   <!-- Nav Item - Complaint Status -->

        <i class="fas fa-fw fa-exclamation-triangle info-icon2"></i>
        <span><strong>Complaint Status</strong></span>
    </a>

        {% endif %}

    </div>
</li>
